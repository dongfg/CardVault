name: Build desktop packages

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the three packages to a GitHub Release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read application version
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r' < desktopApp/build.gradle.kts | sed -n 's/^val appVersion = "\([0-9.]*\)"$/\1/p')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'appVersion must have the form MAJOR.MINOR.PATCH' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
            java_arch: x64
            source: desktopApp/build/distributions/*-windows-x64-single.exe
            filename: CardVault-windows-x64.exe
          - target: macos-x64
            runner: macos-15-intel
            java_arch: x64
            source: desktopApp/build/compose/binaries/main-release/dmg/*.dmg
            filename: CardVault-macos-x64.dmg
          - target: macos-arm64
            runner: macos-15
            java_arch: aarch64
            source: desktopApp/build/compose/binaries/main-release/dmg/*.dmg
            filename: CardVault-macos-arm64.dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: '21'
          architecture: ${{ matrix.java_arch }}
          cache: gradle
      - name: Test and build Windows single EXE
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat :desktopApp:test :desktopApp:testRelease :desktopApp:packageSingleExe --console=plain --stacktrace
      - name: Verify Windows self-extraction
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem -Path 'desktopApp/build/distributions/*-windows-x64-single.exe')
          if ($exe.Count -ne 1) { throw 'Expected exactly one single EXE' }
          & ./desktopApp/packaging/windows/Test-SingleFile.ps1 -Executable $exe[0].FullName
      - name: Test and build macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: bash ./gradlew :desktopApp:test :desktopApp:testRelease :desktopApp:packageReleaseDmg --console=plain --stacktrace
      - name: Prepare download filename
        shell: bash
        env:
          SOURCE_PATTERN: ${{ matrix.source }}
          DOWNLOAD_FILENAME: ${{ matrix.filename }}
        run: |
          shopt -s nullglob
          # The pattern comes from the fixed matrix above; expand it to locate the built package.
          # shellcheck disable=SC2206
          files=( $SOURCE_PATTERN )
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "Expected one package for $SOURCE_PATTERN, found ${#files[@]}" >&2
            exit 1
          fi
          mkdir -p release-assets
          cp "${files[0]}" "release-assets/$DOWNLOAD_FILENAME"
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: CardVault-${{ needs.metadata.outputs.version }}-${{ matrix.target }}
          path: release-assets/${{ matrix.filename }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish release
    if: inputs.publish_release
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: CardVault-${{ needs.metadata.outputs.version }}-*
          path: release-assets
          merge-multiple: true
      - name: Publish the packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          test -f release-assets/CardVault-windows-x64.exe
          test -f release-assets/CardVault-macos-x64.dmg
          test -f release-assets/CardVault-macos-arm64.dmg
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CardVault $RELEASE_TAG" \
            --generate-notes --latest
